<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>偏好设置</title>
    <link rel="stylesheet" href="../../../renderer/remixicon-local.css" />
    <style>
      :root {
        --bg-primary: #121212;
        --bg-secondary: #1f1f1f;
        --bg-tertiary: #2c2c2c;
        --text-primary: #e6e6e6;
        --text-secondary: #adb5bd;
        --border-color: #343a40;
        --accent: #238f4a;
      }
      body { margin:0; font-family: system-ui, sans-serif; background:var(--bg-primary); color:var(--text-primary); }
      .wrap { padding: 12px; }
      select, input, button { background:var(--bg-tertiary); color:var(--text-primary); border:1px solid var(--border-color); border-radius:8px; padding:6px 10px; margin:6px; }
      select:focus, input:focus, button:focus {
        outline: none;
        border-color: var(--accent);
      }
      button:hover {
        background: var(--bg-secondary);
      }
    </style>
  </head>
  <body>
  <script src="../theme.js"></script>
    <div class="wrap">
      <div>
        <label>音色偏好
          <select id="voice">
            <option value="E">英音</option>
            <option value="A">美音</option>
            <option value="ALL" selected>全播放</option>
          </select>
        </label>
      </div>
      <div>
        <label><input type="checkbox" id="enableCarousel" checked /> 启用轮播展示</label>
        <label><input type="checkbox" id="shuffleAfterCarousel" /> 轮播后重新乱序</label>
      </div>
      <div>
        <button id="save"><i class="ri-save-2-line"></i> 保存</button>
      </div>
    </div>
    <script>
      const api = () => window.lowbarAPI;
      const voiceEl = document.getElementById('voice');
      const enCarouselEl = document.getElementById('enableCarousel');
      const shuffleEl = document.getElementById('shuffleAfterCarousel');
      const load = async () => {
        try { const r = await api().pluginCall('multiword', 'getPreferences'); const p = (r && r.prefs) || {}; voiceEl.value = p.voice || 'ALL'; enCarouselEl.checked = !!p.enableCarousel; shuffleEl.checked = !!p.shuffleAfterCarousel; } catch (e) {};
      }
        const save = async () => {
        const prefs = { voice: voiceEl.value, enableCarousel: enCarouselEl.checked, shuffleAfterCarousel: shuffleEl.checked };
        try { await api().pluginCall('multiword', 'savePreferences', [prefs]); alert('已保存，下次默认生效'); } catch (e) { alert('保存失败：' + (e?.message||e)); }
      };
      document.getElementById('save').addEventListener('click', save);
      load();

    </script>
  </body>
  </html>
