<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>外部词库</title>
    <link rel="stylesheet" href="../../../renderer/remixicon-local.css" />
    <style>
      :root {
        --bg-primary: #121212;
        --bg-secondary: #1f1f1f;
        --bg-tertiary: #2c2c2c;
        --text-primary: #e6e6e6;
        --text-secondary: #adb5bd;
        --border-color: #343a40;
        --accent: #238f4a;
        --shadow: 0 6px 12px rgba(0,0,0,0.12);
        --shadow-hover: 0 10px 20px rgba(0,0,0,0.18);
      }

      html, body { margin:0; padding:0 !important; height: 100%; }
      body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-primary); color: var(--text-primary); transition: background 0.3s, color 0.3s; }
      .wrap { padding: 24px; max-width: 800px; margin: 0 auto; }
      
      .section { margin-top: 24px; animation: fadeIn 0.3s ease; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

      input, button { 
        font-family: inherit;
        background: var(--bg-tertiary); 
        color: var(--text-primary); 
        border: 1px solid var(--border-color); 
        border-radius: 8px; 
        padding: 8px 12px; 
        transition: all 0.2s;
      }
      
      input:focus, button:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
      button { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
      button:hover { background: var(--bg-secondary); border-color: var(--accent); }
      button:active { transform: translateY(1px); }
      
      button.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
      button.primary:hover { opacity: 0.9; }

      .card { 
        background: var(--bg-secondary); 
        border: 1px solid var(--border-color); 
        border-radius: 12px; 
        padding: 20px; 
        box-shadow: var(--shadow); 
      }
      
      .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-top: 24px; }
      
      .card.square { 
        aspect-ratio: 1;
        width: auto;
        height: auto;
        display: flex; 
        align-items: center; 
        justify-content: center; 
        flex-direction: column; 
        gap: 12px; 
        transition: all 0.2s ease; 
        cursor: pointer; 
        user-select: none;
      }
      .card.square i { font-size: 32px; color: var(--accent); transition: transform 0.2s; }
      .card.square .label { font-size: 15px; font-weight: 500; color: var(--text-primary); }
      .card.square:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: var(--accent); }
      .card.square:hover i { transform: scale(1.1); }
      
      .hero { text-align: center; padding: 40px 20px; }
      .hero h1 { font-size: 24px; margin: 0 0 24px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; }
      .hero i { color: var(--accent); }
      .hero .row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
      
      table { width: 100%; border-collapse: separate; border-spacing: 0; }
      th, td { border-bottom: 1px solid var(--border-color); padding: 12px; text-align: left; }
      th { background: var(--bg-tertiary); font-weight: 600; color: var(--text-secondary); font-size: 13px; }
      th:first-child { border-top-left-radius: 8px; }
      th:last-child { border-top-right-radius: 8px; }
      tr:last-child td { border-bottom: none; }
      
      .subtle { color: var(--text-secondary); font-size: 13px; }
      
      /* Scrollbar */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

      .status-badge {
        display: inline-flex; align-items: center; gap: 6px;
        background: rgba(35, 143, 74, 0.1); 
        color: var(--accent);
        padding: 4px 12px; border-radius: 99px;
        font-size: 13px; font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="bindPanel" class="section">
        <div class="hero">
          <h1><i class="ri-database-2-line"></i> 绑定外部词库</h1>
          <div class="row">
            <input id="url" placeholder="http://localhost:6100" style="min-width: 300px;" />
            <button id="save" class="primary"><i class="ri-link"></i> 连接服务器</button>
            <button id="showQRBind" title="生成二维码"><i class="ri-qr-code-line"></i></button>
          </div>
          <div id="status" class="subtle" style="margin-top:16px;">未连接</div>
          <div class="subtle" style="margin-top:8px;">支持 http(s)；连接后可在下方直接开启轮播或列表展示。</div>
        </div>
      </div>

      <div id="connectedPanel" class="section" style="display:none;">
        <div class="card" style="display:flex; align-items:center; gap:16px; justify-content:space-between; flex-wrap: wrap;">
          <div style="display:flex; align-items:center; gap:12px;">
            <span class="status-badge"><i class="ri-checkbox-circle-line"></i> 已连接</span>
            <span id="connectedUrl" style="font-weight:600; word-break: break-all;"></span>
          </div>
          <div style="display:flex; gap:8px;">
            <button id="showQR" title="显示二维码"><i class="ri-qr-code-line"></i></button>
            <button id="disconnect"><i class="ri-shut-down-line"></i> 断开</button>
          </div>
        </div>

        <div id="sectionAdd" class="section">
          <div class="card">
            <b style="display: block; margin-bottom: 12px;"><i class="ri-add-circle-line" style="color:var(--accent)"></i> 添加词汇</b>
            <div style="display:flex; gap:10px; align-items:center; flex-wrap: wrap;">
              <input id="wWord" placeholder="英文单词" style="flex:1; min-width: 120px;" />
              <input id="wCN" placeholder="汉语解释（选填）" style="flex:1.5; min-width: 160px;" />
              <button id="btnAdd" class="primary"><i class="ri-save-2-line"></i> 添加</button>
            </div>
            <div id="addResult" class="subtle" style="margin-top:8px;"></div>
          </div>
        </div>

        <div class="modes">
          <div class="card square" data-act="carousel">
            <i class="ri-slideshow-line"></i>
            <div class="label">轮播展示</div>
          </div>
          <div class="card square" data-act="all">
            <i class="ri-list-check-2"></i>
            <div class="label">列表展示</div>
          </div>
          <div class="card square" data-act="check">
            <i class="ri-search-eye-line"></i>
            <div class="label">检查模式</div>
          </div>
          <div class="card square" data-act="quickcheck">
            <i class="ri-flashlight-line"></i>
            <div class="label">快速检查</div>
          </div>
        </div>

        <div id="sectionList" class="section">
          <div class="card">
            <b style="display: block; margin-bottom: 12px;"><i class="ri-file-list-line" style="color:var(--accent)"></i> 词库列表</b>
            <div style="overflow-x: auto;">
              <table>
                <thead><tr><th>单词</th><th>汉语</th><th>时间</th></tr></thead>
                <tbody id="wordsTbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="../theme.js"></script>
    <script>
      // API Interface
      const api = () => {
        const lb = window.lowbarAPI;
        if (lb && typeof lb.pluginCall === 'function') return lb;
        return {
          pluginCall: async (plugin, method, args = []) => {
            if (plugin !== 'multiword') return { ok: false, error: 'unsupported plugin in static preview' };
            if (method === 'getWordbankUrl') {
              const url = localStorage.getItem('multiword:wordbank:url') || '';
              return { ok: true, url };
            }
            if (method === 'setWordbankUrl') {
              const s = String((args && args[0]) || '');
              localStorage.setItem('multiword:wordbank:url', s);
              return { ok: true };
            }
            if (method === 'getTheme') {
               // Fallback for preview
               return { ok: true, mode: 'system', color: '#238f4a' };
            }
            return { ok: false, error: 'unsupported method in static preview' };
          },
          emitEvent: () => {}
        };
      };

      const statusEl = document.getElementById('status');
      const urlEl = document.getElementById('url');
      const bindPanel = document.getElementById('bindPanel');
      const connectedPanel = document.getElementById('connectedPanel');
      const connectedUrlEl = document.getElementById('connectedUrl');
      const sectionAdd = document.getElementById('sectionAdd');
      const sectionList = document.getElementById('sectionList');
      const tbody = document.getElementById('wordsTbody');
      const addResEl = document.getElementById('addResult');

      const showBindOnly = () => { bindPanel.style.display = ''; connectedPanel.style.display = 'none'; };
      const isLocalUrl = (u) => { try { const url = new URL(u); return ['localhost','127.0.0.1','::1'].includes(url.hostname); } catch (e) { return false; } };
      
      const showConnected = (u) => {
        bindPanel.style.display = 'none'; connectedPanel.style.display = ''; connectedUrlEl.textContent = u;
        sectionAdd.style.display = 'none';
        sectionList.style.display = 'none';
        
        try {
          const toUrl = (page, params={}) => {
            const base = new URL(page, window.location.href);
            Object.entries(params).forEach(([k,v]) => base.searchParams.set(k, String(v)));
            return base.href;
          };
          
          const emit = (target, value) => {
             // FIX: Use 'multiword-channel' instead of 'multiword.lowbar'
             window.lowbarAPI.emitEvent('multiword-channel', { type:'update', target, value });
          };

          const openCarousel = () => {
            const float = new URL('./range-select.html', window.location.href).href;
            const href = toUrl(float, { server: String(u||'').trim(), next:'carousel' });
            emit('floatingBounds', { width: 980, height: 680 });
            emit('floatingUrl', href);
          };
          const openAll = () => {
            const float = new URL('./range-select.html', window.location.href).href;
            const href = toUrl(float, { server: String(u||'').trim(), next:'allwords' });
            emit('floatingBounds', { width: 980, height: 680 });
            emit('floatingUrl', href);
          };
          const openCheck = () => {
            const float = new URL('./range-select.html', window.location.href).href;
            const href = toUrl(float, { server: String(u||'').trim(), next:'check' });
            emit('floatingBounds', { width: 980, height: 680 });
            emit('floatingUrl', href);
          };
          const openQuick = () => {
            const float = new URL('./range-select.html', window.location.href).href;
            const href = toUrl(float, { server: String(u||'').trim(), next:'quickcheck' });
            emit('floatingBounds', { width: 980, height: 680 });
            emit('floatingUrl', href);
          };

          // Re-attach listeners safely (remove old ones if possible, but cloning is easier to clear events)
          document.querySelectorAll('.modes .card.square').forEach(card => {
            // Clone to strip old event listeners
            const newCard = card.cloneNode(true);
            card.parentNode.replaceChild(newCard, card);
            
            newCard.addEventListener('click', () => {
              const act = newCard.getAttribute('data-act');
              if (act === 'carousel') openCarousel();
              else if (act === 'all') openAll();
              else if (act === 'check') openCheck();
              else if (act === 'quickcheck') openQuick();
            });
          });
        } catch (e) { console.error(e); }

        // QR Code Handler
        try {
            const btnQR = document.getElementById('showQR');
            // Clone to strip old listeners
            const newBtn = btnQR.cloneNode(true);
            btnQR.parentNode.replaceChild(newBtn, btnQR);
            
            newBtn.addEventListener('click', () => {
              const text = String(u||'').trim();
              if (!text) return;
              showQRCode(text);
            });
        } catch(e) {}
      };

      const showQRCode = (text) => {
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:9999;backdrop-filter:blur(2px);';
        const box = document.createElement('div');
        box.style.cssText = 'background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:24px;min-width:280px;display:flex;flex-direction:column;gap:16px;align-items:center;box-shadow:var(--shadow-hover);';
        const title = document.createElement('div');
        title.textContent = '服务器地址二维码';
        title.style.cssText = 'font-weight:600;font-size:16px;';
        const img = document.createElement('img');
        img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(text);
        img.alt = text;
        img.style.borderRadius = '8px';
        const link = document.createElement('div');
        link.textContent = text;
        link.style.cssText = 'font-size:12px;opacity:.85;word-break:break-all;text-align:center;max-width:240px;';
        const close = document.createElement('button');
        close.innerHTML = '<i class="ri-close-line"></i> 关闭';
        close.onclick = () => { try { document.body.removeChild(overlay); } catch (e) {} };
        box.appendChild(title); box.appendChild(img); box.appendChild(link); box.appendChild(close);
        overlay.appendChild(box);
        overlay.addEventListener('click', (e) => { if (e.target === overlay) close.click(); });
        document.body.appendChild(overlay);
      };

      const fetchHealth = async (base) => {
        try { const r = await fetch(base.replace(/\/$/, '') + '/health'); const j = await r.json(); return !!(j && j.ok); } catch (e) { return false; }
      };
      const loadWords = async (base) => {
        try {
          const r = await fetch(base.replace(/\/$/, '') + '/words');
          const j = await r.json();
          const tz = 'Asia/Shanghai';
          const fmt = (ms) => {
            try {
              const d = new Date(ms||Date.now());
              const parts = new Intl.DateTimeFormat('zh-CN', { timeZone: tz, hour12: false, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' }).formatToParts(d);
              const get = (t) => parts.find(p=>p.type===t)?.value || '';
              return `${get('year')}-${get('month')}-${get('day')} ${get('hour')}:${get('minute')}:${get('second')}`;
            } catch (e) { return new Date(ms||Date.now()).toLocaleString(); }
          };
          const list = Array.isArray(j.words) ? j.words.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)) : [];
          tbody.innerHTML = list.map(w => `<tr><td>${w.word}</td><td>${w.cn||''}</td><td>${fmt(w.createdAt)}</td></tr>`).join('');
        } catch (e) { tbody.innerHTML = '<tr><td colspan="3">加载失败</td></tr>'; }
      };
      const syncUrl = async () => {
        try {
          const r = await api().pluginCall('multiword', 'getWordbankUrl');
          const saved = (r && r.url) || '';
          let last = saved;
          if (!last) {
            try { last = localStorage.getItem('multiword.externallib.url') || ''; } catch (e) {}
          }
          urlEl.value = last;
          if (!last) { statusEl.textContent = '未连接'; showBindOnly(); return; }
          const ok = await fetchHealth(last);
          statusEl.textContent = ok ? ('服务器健康正常：' + last) : ('无法连接：' + last);
          if (ok) {
            showConnected(last);
            await loadWords(last);
            if (!saved && last) { try { await api().pluginCall('multiword', 'setWordbankUrl', [last]); } catch (e) {} }
          } else {
            showBindOnly();
          }
        } catch (e) { showBindOnly(); }
      };
      document.getElementById('save').addEventListener('click', async () => {
        try {
          const s = urlEl.value.trim();
          if (!s) { statusEl.textContent = '未连接'; showBindOnly(); return; }
          await api().pluginCall('multiword', 'setWordbankUrl', [s]);
          const ok = await fetchHealth(s);
          statusEl.textContent = ok ? ('服务器健康正常：' + s) : ('无法连接：' + s);
          if (ok) {
            try { localStorage.setItem('multiword.externallib.url', s); } catch (e) {}
            showConnected(s);
            await loadWords(s);
          }
        } catch (e) { alert('连接失败：' + (e?.message||e)); }
      });
      try {
        const btnQRBind = document.getElementById('showQRBind');
        if (btnQRBind) {
          btnQRBind.addEventListener('click', () => {
            const text = String(urlEl.value||'').trim();
            if (!text) return;
            showQRCode(text);
          });
        }
      } catch (e) {}
      document.getElementById('disconnect').addEventListener('click', async () => {
        try {
          await api().pluginCall('multiword', 'setWordbankUrl', ['']);
          try { localStorage.removeItem('multiword.externallib.url'); } catch (e) {}
          statusEl.textContent = '未连接';
          showBindOnly();
        } catch (e) {}
      });

      document.getElementById('btnAdd').addEventListener('click', async () => {
        const word = document.getElementById('wWord').value.trim();
        const cn = document.getElementById('wCN').value.trim();
        if (!word) { addResEl.textContent = '请输入英文单词'; return; }
        try {
          const r = await api().pluginCall('multiword', 'getWordbankUrl');
          const base = (r && r.url) || '';
          if (!base) { addResEl.textContent = '未连接服务器'; return; }
          const resp = await fetch(base.replace(/\/$/, '') + '/words', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ word, cn }) });
          const j = await resp.json();
          if (j && j.ok) { addResEl.textContent = '已添加：' + j.item.word; await loadWords(base); } else { addResEl.textContent = '添加失败'; }
        } catch (e) { addResEl.textContent = '添加失败：' + (e?.message||e); }
      });

      syncUrl();
    </script>
  </body>
  </html>
