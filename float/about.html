<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>关于插件</title>
    <link rel="stylesheet" href="../../../renderer/remixicon-local.css" />
    <style>
      :root {
        --bg-primary: #121212;
        --bg-secondary: #1f1f1f;
        --bg-tertiary: #2c2c2c;
        --text-primary: #e6e6e6;
        --text-secondary: #adb5bd;
        --border-color: #343a40;
        --accent: #238f4a;
      }
      
      body { margin:0; font-family: system-ui, sans-serif; background:var(--bg-primary); color:var(--text-primary); }
      .wrap { padding: 16px; }
      .card { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:10px; padding:14px; }
      h2 { color:var(--text-primary); margin-top:0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h2><i class="ri-information-line"></i> 多维单词 · 关于</h2>
        <div>版本：0.1.0</div>
        <div>说明：基于“UI模板-低栏应用”实现的单词学习辅助插件，支持听力、自测、检查、外部词库与在线词典等模块（外部词库和在线词库外功能暂未实现完毕）。</div>
      </div>
    </div>
    <script src="../theme.js"></script>
  </body>
</html>
